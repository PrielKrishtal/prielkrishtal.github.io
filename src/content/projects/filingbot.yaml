name: FilingBot
order: 1
status: Live 24/7
host: Oracle Cloud VM, Docker Compose
summary: Event-driven pipeline that reads SEC Form 4 insider-trade filings and alerts on the high-signal ones.
problem: Polls SEC EDGAR for Form 4 insider-trade filings and sends Telegram alerts on the high-signal trades.
stack: [Python, FastAPI, Redis Streams, PostgreSQL, Docker Compose, Oracle Cloud, Groq, Pydantic, Sentry, GitHub Actions]
repo: https://github.com/PrielKrishtal/filingbot

numbers:
  - { value: "570+", label: live filings processed }
  - { value: "67%", label: fewer LLM calls across 572 filings }
  - { value: "427 MB", label: "Docker image, down from 1.8 GB" }
  - { value: "4", label: services monitored by Sentry }

decisions:
  - { chose: "rules first, then the LLM", over: "the LLM on every filing", because: null }
  - { chose: Redis Streams with consumer groups, over: null, because: null }
  - { chose: "Pydantic validation with one corrective retry, then a dead-letter queue", over: null, because: null }
