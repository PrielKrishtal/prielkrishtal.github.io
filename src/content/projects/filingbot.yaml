# TODO(priel): check this diagram against the real architecture, then delete this line.
diagram:
  live: true
  caption: How a filing moves through FilingBot.
  boundary: { label: Docker Compose on an Oracle Cloud VM, from: 1, to: 5 }
  band: Sentry on 4 services. A correlation ID on every filing's JSON logs.
  columns:
    - { id: edgar, label: SEC EDGAR, detail: Form 4 filings, external: true }
    - { id: poller, label: Poller, detail: checks EDGAR for new filings }
    - { id: stream, label: Redis Streams, detail: consumer groups }
    - id: classify
      label: Classifier
      detail: "rules first, then the LLM"
      above: { id: groq, label: Groq, detail: GPT-OSS 120B, external: true }
    - id: validate
      label: Pydantic
      detail: one corrective retry
      below: { id: dlq, label: Dead-letter queue, detail: after the retry fails }
    - { id: store, label: PostgreSQL, detail: unique constraint drops duplicates }
    - { id: telegram, label: Telegram, detail: alerts on high-signal trades, external: true }
  paths:
    - id: valid
      label: A valid filing
      note: Validated, stored once, alerted if it's high-signal.
      steps: [{ node: edgar }, { node: poller }, { node: stream }, { node: classify }, { node: groq }, { node: validate }, { node: store }, { node: telegram }]
    - id: invalid
      label: Fails validation
      note: One corrective retry, then the filing goes to the dead-letter queue.
      steps: [{ node: edgar }, { node: poller }, { node: stream }, { node: classify }, { node: groq }, { node: validate, mark: retry }, { node: dlq, end: fail }]
    - id: duplicate
      label: A duplicate filing
      note: PostgreSQL's unique constraint rejects it.
      steps: [{ node: edgar }, { node: poller }, { node: stream }, { node: classify }, { node: validate }, { node: store, end: fail }]
