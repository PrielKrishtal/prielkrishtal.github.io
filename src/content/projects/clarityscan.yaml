name: ClarityScan
order: 2
status: Deployed
host: Render
summary: Receipt-management SaaS that turns skewed, low-light Hebrew and English receipts into reviewable records.
problem: Receipt management that reads skewed, low-light Hebrew and English receipts without blocking the upload.
stack: [Python, FastAPI, React 18, Tailwind CSS, PostgreSQL, SQLAlchemy (async), Alembic, Google Cloud Vision, OpenCV, Render]
repo: https://github.com/PrielKrishtal/clarity-scan

numbers:
  - { value: "<50 ms", label: HTTP 202 on upload }
  - { value: "~70%", label: better extraction on degraded images (estimate) }
  - { value: "5/min", label: rate limit per IP }
  - { value: "5", label: states in the receipt state machine }

decisions:
  # TODO(priel): replace each `because: null` with one short reason.
  - { chose: HTTP 202 now with OCR in FastAPI BackgroundTasks, over: OCR inside the upload request, because: null }
  - { chose: Google Cloud Vision, over: PaddleOCR, because: PaddleOCR ran out of memory on the free tier }
  - { chose: "Numeric(10,2) for money", over: float, because: null }

fixes:
  - { broke: "RAM exhaustion on the live OCR worker (PaddleOCR)", fix: "moved OCR to Google Cloud Vision with no downtime, then added FSM and OCR-adapter tests" }

