# TODO(priel): check this diagram against the real architecture, then delete this line.
diagram:
  caption: How a receipt moves through ClarityScan. Pick an outcome to follow it.
  boundary: { label: Deployed on Render, from: 1, to: 5 }
  columns:
    - { id: client, label: React 18 client, detail: uploads a receipt photo, external: true }
    - { id: api, label: FastAPI, detail: answers HTTP 202 in under 50 ms }
    - { id: task, label: BackgroundTasks, detail: OCR runs off the request }
    - { id: opencv, label: OpenCV, detail: "blur, Otsu threshold, homography" }
    - id: ocr
      label: OCR adapter
      detail: Hebrew and English
      above: { id: vision, label: Google Cloud Vision, detail: text extraction, external: true }
    - { id: db, label: PostgreSQL, detail: "state machine, Numeric(10,2) money" }
  states: [UPLOADED, PROCESSING, REVIEW_NEEDED, APPROVED, FAILED]
  paths:
    - id: approved
      label: Approved receipt
      note: The upload answers at once; OCR runs in the background, then the receipt waits for review.
      steps: [{ node: client }, { node: api, state: UPLOADED }, { node: task, state: PROCESSING }, { node: opencv, state: PROCESSING }, { node: ocr, state: PROCESSING }, { node: vision, state: PROCESSING }, { node: db, state: REVIEW_NEEDED }, { node: db, state: APPROVED }]
    - id: failed
      label: Failed receipt
      note: Same flow, ending in the FAILED state.
      steps: [{ node: client }, { node: api, state: UPLOADED }, { node: task, state: PROCESSING }, { node: opencv, state: PROCESSING }, { node: ocr, state: PROCESSING }, { node: vision, state: PROCESSING }, { node: db, state: REVIEW_NEEDED }, { node: db, state: FAILED, end: fail }]
