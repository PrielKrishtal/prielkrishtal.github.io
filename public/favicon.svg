  <rect class="line" x="11" y="9" width="10" height="2" />
  <rect class="line" x="11" y="13" width="7" height="2" />
  <rect class="scan" x="8" y="18" width="16" height="2.5" />
  <rect class="line" x="11" y="22" width="9" height="2" />
</svg>
